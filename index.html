<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BreakpointPro — Responsive Breakpoint Previewer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: #2a2a3a;
      --text: #e4e4ef;
      --text-dim: #8888a0;
      --accent: #6c63ff;
      --accent-hover: #7f78ff;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---- Toolbar ---- */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    .toolbar .brand {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .toolbar .brand span { color: var(--accent); }

    .url-group {
      flex: 1;
      min-width: 240px;
      display: flex;
      gap: 8px;
    }

    .url-group input {
      flex: 1;
      padding: 9px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .url-group input:focus { border-color: var(--accent); }

    .btn {
      padding: 9px 18px;
      border-radius: var(--radius);
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--accent-hover); }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toggle-btn {
      padding: 7px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(108, 99, 255, 0.1);
    }

    .zoom-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .zoom-group input[type="range"] {
      width: 100px;
      accent-color: var(--accent);
    }

    .custom-bp-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .custom-bp-group input {
      width: 60px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.85rem;
      text-align: center;
      outline: none;
    }

    .custom-bp-group input:focus { border-color: var(--accent); }

    .custom-bp-group .btn { padding: 6px 12px; font-size: 0.8rem; }

    /* ---- Notice ---- */
    .notice {
      background: rgba(255, 180, 50, 0.08);
      border: 1px solid rgba(255, 180, 50, 0.25);
      color: #ccaa55;
      padding: 10px 24px;
      font-size: 0.85rem;
      text-align: center;
    }

    /* ---- Viewport Grid ---- */
    .viewport-container {
      flex: 1;
      padding: 24px;
      display: flex;
      gap: 24px;
      overflow-x: auto;
      align-items: flex-start;
    }

    .device-frame {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .device-label {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 8px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dim);
      text-align: center;
      width: 100%;
    }

    .device-label .dims {
      font-weight: 400;
      opacity: 0.7;
      margin-left: 6px;
    }

    .iframe-wrapper {
      border: 1px solid var(--border);
      border-radius: 0 0 var(--radius) var(--radius);
      overflow: hidden;
      background: #fff;
      position: relative;
    }

    .iframe-wrapper iframe {
      display: block;
      border: none;
      transform-origin: top left;
    }

    /* ---- Empty State ---- */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text-dim);
      padding: 60px 20px;
      text-align: center;
      width: 100%;
    }

    .empty-state .icon { font-size: 3rem; opacity: 0.4; }
    .empty-state h2 { font-size: 1.3rem; color: var(--text); font-weight: 600; }
    .empty-state p { max-width: 400px; line-height: 1.6; }

    /* ---- Scrollbar ---- */
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a50; }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="brand"><span>Breakpoint</span>Pro</div>
    <div class="url-group">
      <input type="url" id="urlInput" placeholder="Enter URL (e.g. https://example.com)" spellcheck="false" />
      <button class="btn" id="loadBtn">Preview</button>
    </div>
    <div class="controls">
      <button class="toggle-btn active" id="portraitBtn">Portrait</button>
      <button class="toggle-btn" id="landscapeBtn">Landscape</button>
      <div class="zoom-group">
        <label for="zoomSlider">Zoom:</label>
        <input type="range" id="zoomSlider" min="20" max="100" value="40" />
        <span id="zoomValue">40%</span>
      </div>
      <div class="custom-bp-group">
        <input type="number" id="customW" placeholder="W" min="100" max="3840" />
        <span>x</span>
        <input type="number" id="customH" placeholder="H" min="100" max="2160" />
        <button class="btn" id="addCustomBtn">+ Add</button>
      </div>
    </div>
  </div>

  <div class="notice">
    Some sites block iframe embedding via X-Frame-Options or CSP headers. This tool works best for previewing <strong>your own sites</strong> during development.
  </div>

  <div class="viewport-container" id="viewportContainer">
    <div class="empty-state" id="emptyState">
      <div class="icon">📐</div>
      <h2>Responsive Breakpoint Previewer</h2>
      <p>Enter a URL above to see it rendered at multiple device sizes simultaneously.</p>
    </div>
  </div>

  <script type="module">
    const DEVICES = [
      { name: 'iPhone SE', w: 375, h: 667 },
      { name: 'iPhone 14 Pro', w: 393, h: 852 },
      { name: 'iPad', w: 768, h: 1024 },
      { name: 'Laptop', w: 1280, h: 800 },
      { name: 'Desktop', w: 1920, h: 1080 },
    ];

    let customDevices = [];
    let isLandscape = false;
    let zoomPercent = 40;
    let currentUrl = '';

    const urlInput = document.getElementById('urlInput');
    const loadBtn = document.getElementById('loadBtn');
    const portraitBtn = document.getElementById('portraitBtn');
    const landscapeBtn = document.getElementById('landscapeBtn');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomValue = document.getElementById('zoomValue');
    const container = document.getElementById('viewportContainer');
    const emptyState = document.getElementById('emptyState');
    const customW = document.getElementById('customW');
    const customH = document.getElementById('customH');
    const addCustomBtn = document.getElementById('addCustomBtn');

    function normalizeUrl(input) {
      let url = input.trim();
      if (!url) return '';
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      try { new URL(url); return url; } catch { return ''; }
    }

    function getAllDevices() {
      return [...DEVICES, ...customDevices];
    }

    function render() {
      if (!currentUrl) {
        container.innerHTML = '';
        container.appendChild(emptyState);
        emptyState.style.display = 'flex';
        return;
      }

      container.innerHTML = '';
      const scale = zoomPercent / 100;

      for (const device of getAllDevices()) {
        const dw = isLandscape ? device.h : device.w;
        const dh = isLandscape ? device.w : device.h;
        const scaledW = dw * scale;
        const scaledH = dh * scale;

        const frame = document.createElement('div');
        frame.className = 'device-frame';

        const label = document.createElement('div');
        label.className = 'device-label';
        label.innerHTML = `${device.name}<span class="dims">${dw}x${dh}</span>`;
        if (device.custom) {
          const removeBtn = document.createElement('span');
          removeBtn.textContent = ' ✕';
          removeBtn.style.cursor = 'pointer';
          removeBtn.style.marginLeft = '6px';
          removeBtn.style.color = '#ff6b6b';
          removeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            customDevices = customDevices.filter(d => d !== device);
            render();
          });
          label.appendChild(removeBtn);
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'iframe-wrapper';
        wrapper.style.width = scaledW + 'px';
        wrapper.style.height = scaledH + 'px';

        const iframe = document.createElement('iframe');
        iframe.src = currentUrl;
        iframe.width = dw;
        iframe.height = dh;
        iframe.style.width = dw + 'px';
        iframe.style.height = dh + 'px';
        iframe.style.transform = `scale(${scale})`;
        iframe.setAttribute('loading', 'lazy');
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups');

        wrapper.appendChild(iframe);
        frame.appendChild(label);
        frame.appendChild(wrapper);
        container.appendChild(frame);
      }
    }

    function loadUrl() {
      const url = normalizeUrl(urlInput.value);
      if (!url) { urlInput.focus(); return; }
      currentUrl = url;
      render();
    }

    loadBtn.addEventListener('click', loadUrl);
    urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadUrl(); });

    portraitBtn.addEventListener('click', () => {
      isLandscape = false;
      portraitBtn.classList.add('active');
      landscapeBtn.classList.remove('active');
      render();
    });

    landscapeBtn.addEventListener('click', () => {
      isLandscape = true;
      landscapeBtn.classList.add('active');
      portraitBtn.classList.remove('active');
      render();
    });

    zoomSlider.addEventListener('input', () => {
      zoomPercent = parseInt(zoomSlider.value);
      zoomValue.textContent = zoomPercent + '%';
      render();
    });

    addCustomBtn.addEventListener('click', () => {
      const w = parseInt(customW.value);
      const h = parseInt(customH.value);
      if (!w || !h || w < 100 || h < 100) return;
      customDevices.push({ name: `Custom`, w, h, custom: true });
      customW.value = '';
      customH.value = '';
      render();
    });

    // Init
    render();
  </script>
</body>
</html>
